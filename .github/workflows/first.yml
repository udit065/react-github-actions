name: First Workflow
on: push

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: ESLint validate
        run: npm run lint

      - name: Make Build
        run: npm run build