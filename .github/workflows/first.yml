name: First Workflow
on: push

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: ESLint validate
        run: npm run lint

  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Test Case
        run: npm run test

  build-job:
    needs: [lint-job,test-job]
    runs-on: ubuntu-latest

    env:
        VERCEL_ORG_ID: "${{secrets.VERCEL_ORG_ID}}"
        VERCEL_PROJECT_ID: "${{secrets.VERCEL_PROJECT_ID}}"

    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: node setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependency
        run: npm ci
      - name: Make Build
        run: npm run build

      - name: Create Artifact
        uses: actions/upload-artifact@v4
        with:
              name: react-build
              path: dist/
              retention-days: 3

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy on Vercel
        run: vercel deploy dist --prod --yes --token="${{secrets.VERCEL_TOKEN}}"
